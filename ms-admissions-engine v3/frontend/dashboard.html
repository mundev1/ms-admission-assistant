<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎓 Results Dashboard — MS Admissions Matrix Engine</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* ── Dashboard-specific styles ──────────────────────────────────── */
    .page-main { padding: 1.75rem 0 4rem; }

    /* Applicant summary */
    .summary-card {
      background: linear-gradient(135deg, var(--clr-surface) 0%, var(--clr-surface-2) 100%);
      border: 1.5px solid var(--clr-gold);
      box-shadow: var(--shadow-gold), var(--shadow-md);
    }

    .summary-header {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .applicant-avatar {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--clr-gold-dark), var(--clr-gold));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--clr-bg);
      flex-shrink: 0;
      box-shadow: var(--shadow-gold);
    }

    .applicant-info { flex: 1; }
    .applicant-name { font-size: 1.2rem; font-weight: 800; color: var(--clr-white); }
    .applicant-sub  { font-size: 0.82rem; color: var(--clr-text-muted); margin-top: 0.15rem; }

    /* Controls bar */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1.5rem 0;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    /* Sort select */
    .sort-select {
      padding: 0.4rem 0.85rem;
      background: var(--clr-bg-alt);
      border: 1.5px solid var(--clr-border);
      border-radius: var(--radius-sm);
      color: var(--clr-text);
      font-size: 0.85rem;
      font-family: var(--font-sans);
      cursor: pointer;
      outline: none;
      -webkit-appearance: none;
    }
    .sort-select:focus { border-color: var(--clr-gold); }

    /* Results section header */
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .results-count {
      font-size: 0.85rem;
      color: var(--clr-text-muted);
    }

    .results-count strong { color: var(--clr-gold); }

    /* ── Program card internals ──────────────────────────────── */
    .program-region-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.15rem 0.5rem;
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 600;
      background: rgba(255,255,255,0.07);
      color: var(--clr-text-muted);
      margin-top: 0.2rem;
    }

    .program-card-divider {
      height: 1px;
      background: var(--clr-border);
      margin: 0.25rem 0;
    }

    .program-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.25rem;
    }

    /* ── Sidebar detail panel ────────────────────────────────── */
    .sidebar-section { margin-bottom: 1.5rem; }
    .sidebar-section-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--clr-text-muted);
      margin-bottom: 0.75rem;
    }

    .detail-score-hero {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1.25rem;
      background: var(--clr-bg-alt);
      border-radius: var(--radius-md);
      margin-bottom: 1.25rem;
    }

    .detail-score-info h3 { margin-bottom: 0.25rem; }
    .detail-score-info p  { font-size: 0.82rem; }

    /* ── No results state ────────────────────────────────────── */
    .no-results {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--clr-text-muted);
    }
    .no-results .icon { font-size: 3rem; margin-bottom: 1rem; }

    /* Animation stagger for cards */
    .program-card:nth-child(1)  { animation-delay: 0.04s; }
    .program-card:nth-child(2)  { animation-delay: 0.08s; }
    .program-card:nth-child(3)  { animation-delay: 0.12s; }
    .program-card:nth-child(4)  { animation-delay: 0.16s; }
    .program-card:nth-child(5)  { animation-delay: 0.20s; }
    .program-card:nth-child(6)  { animation-delay: 0.24s; }
    .program-card:nth-child(7)  { animation-delay: 0.28s; }
    .program-card:nth-child(8)  { animation-delay: 0.32s; }
    .program-card:nth-child(9)  { animation-delay: 0.36s; }
    .program-card:nth-child(10) { animation-delay: 0.40s; }
    .program-card:nth-child(n+11) { animation-delay: 0.44s; }

    /* Demo banner */
    .demo-banner {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1.25rem;
      background: rgba(244, 197, 66, 0.1);
      border: 1px solid rgba(244, 197, 66, 0.35);
      border-radius: var(--radius-md);
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
      color: var(--clr-text-muted);
    }
    .demo-banner strong { color: var(--clr-gold); }

    @media (max-width: 768px) {
      .controls-bar { flex-direction: column; align-items: flex-start; }
      .controls-right { width: 100%; }
    }
  </style>
</head>

<!-- ── Header ───────────────────────────────────────────────────────────── -->
<header class="app-header">

    <div class="brand">
      <div class="brand-title">🎓 MS Admissions Matrix Engine</div>

    </div>

</header>

<!-- ── Sidebar overlay ───────────────────────────────────────────────── -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ── Detail Sidebar ───────────────────────────────────────────────── -->
<aside class="detail-sidebar" id="detailSidebar" aria-label="Program details">
  <div class="detail-sidebar-header">
    <h3 id="sidebarTitle">Program Details</h3>

  </div>
  <div id="sidebarContent"></div>
</aside>

<!-- ── Toast container ──────────────────────────────────────────────── -->
<div class="toast-container" id="toastContainer"></div>

<!-- ── Main ─────────────────────────────────────────────────────────── -->
<main class="page-main">
  <div class="container">

    <!-- Demo banner (shown when no real backend data) -->
    <div class="demo-banner hidden" id="demoBanner">
      🎭 <span><strong>Demo Mode</strong> — Showing sample results. Submit the form with a running backend for live scoring.</span>
    </div>

    <!-- Applicant Summary Card -->
    <div class="card summary-card mb-md" id="summaryCard">
      <div class="summary-header">
        <div class="applicant-avatar" id="avatarInitials">?</div>
        <div class="applicant-info">
          <div class="applicant-name" id="applicantName">Loading…</div>
          <div class="applicant-sub" id="applicantSub"></div>
        </div>
        <div class="flex items-center gap-sm flex-wrap">
          <span class="tier-badge" id="overallTier" style="font-size:0.85rem;padding:0.4rem 1rem"></span>
        </div>
      </div>
      <div class="stat-grid" id="statGrid"></div>
    </div>

    <!-- Region Tabs -->
    <div id="regionTabsWrap" class="mb-md hidden">
      <div class="tab-bar" id="regionTabBar" role="tablist"></div>
    </div>

    <!-- Controls bar -->
    <div class="controls-bar">
      <div class="controls-left">
        <span class="filter-bar">
          <span class="filter-label">Filter:</span>
          <label class="check-pill pill-safe">
            <input type="checkbox" id="filterSafe" checked />
            <label for="filterSafe">🟢 Safe</label>
          </label>
          <label class="check-pill pill-match">
            <input type="checkbox" id="filterMatch" checked />
            <label for="filterMatch">🟡 Match</label>
          </label>
          <label class="check-pill pill-reach">
            <input type="checkbox" id="filterReach" checked />
            <label for="filterReach">🟠 Reach</label>
          </label>
          <label class="check-pill pill-unlikely">
            <input type="checkbox" id="filterUnlikely" checked />
            <label for="filterUnlikely">🔴 Unlikely</label>
          </label>
        </span>
      </div>
      <div class="controls-right">
        <select class="sort-select" id="sortSelect" aria-label="Sort programs">
          <option value="score-desc">Score: High → Low</option>
          <option value="score-asc">Score: Low → High</option>
          <option value="name-asc">University A → Z</option>
          <option value="name-desc">University Z → A</option>
        </select>
      </div>
    </div>

    <!-- Results header -->
    <div class="results-header">
      <div>
        <h2 id="resultsTitle">Program Compatibility Results</h2>
        <p class="results-count" id="resultsCount"></p>
      </div>
    </div>

    <!-- Tab panels (populated dynamically) -->
    <div id="tabPanelsContainer"></div>

  </div><!-- .container -->
</main>

<script type="module">
  import {
    cgpaToUS4pt, cgpaToJapanese4pt, cgpaToEctsGrade,
    greToPercentile, jlptToLabel, buildScoreComponents,
    computeResearchComposite
  } from './js/normalizer.js';

  // ── Helpers ──────────────────────────────────────────────────────────────

  function $(sel, ctx = document) { return ctx.querySelector(sel); }
  function $$(sel, ctx = document) { return [...ctx.querySelectorAll(sel)]; }

  function showToast(title, msg, type = 'info') {
    const icons = { info: 'ℹ️', error: '❌', success: '✅', warning: '⚠️' };
    const container = $('#toastContainer');
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.innerHTML = `
      <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
      <div class="toast-body">
        <div class="toast-title">${title}</div>
        ${msg ? `<div class="toast-msg">${msg}</div>` : ''}
      </div>`;
    container.appendChild(el);
    setTimeout(() => el.remove(), 4500);
  }

  function getTier(score) {
    if (score >= 80) return 'SAFE';
    if (score >= 65) return 'MATCH';
    if (score >= 50) return 'REACH';
    return 'UNLIKELY';
  }

  function getTierEmoji(tier) {
    return { SAFE: '🟢', MATCH: '🟡', REACH: '🟠', UNLIKELY: '🔴' }[tier] || '';
  }

  function getTierClass(tier) {
    return { SAFE: 'safe', MATCH: 'match', REACH: 'reach', UNLIKELY: 'unlikely' }[tier] || '';
  }

  function getScoreColor(tier) {
    return {
      SAFE:     'var(--tier-safe)',
      MATCH:    'var(--tier-match)',
      REACH:    'var(--tier-reach)',
      UNLIKELY: 'var(--tier-unlikely)',
    }[tier] || 'var(--clr-gold)';
  }

  function getBarClass(val) {
    if (val >= 75) return 'bar-good';
    if (val >= 55) return 'bar-mid';
    if (val >= 35) return 'bar-low';
    return 'bar-bad';
  }

  function regionFlag(region) {
    return { US: '🇺🇸', EU: '🇪🇺', JP: '🇯🇵' }[region] || '🌐';
  }

  function regionName(region) {
    return { US: 'United States', EU: 'Europe', JP: 'Japan', ALL: 'All Regions' }[region] || region;
  }

  function initials(name = '') {
    return name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
  }

  // ── MOCK DATA ─────────────────────────────────────────────────────────────

      ],

    },
    {
      programId: 'JP-002', programName: 'Graduate School of Information Science',
      universityName: 'University of Tokyo (Todai)', region: 'JP', country: 'Japan',
      overallScore: 58,
      components: { gpaScore: 70, greQ: 82, greV: 62, lang: 70, research: 48, jlpt: 20 },
      deficits: [
        { field: 'CGPA', gap: 'Todai typically admits students above 8.5/10' },
        { field: 'JLPT', gap: 'N2 minimum strongly recommended; N1 preferred' },
        { field: 'Research', gap: 'Publications in top venues expected for research track' },
      ],
      recommendations: ['English-track MSc programs available — consider GSII program', 'MEXT scholarship aligned — check eligibility'],
    },
    {
      programId: 'JP-003', programName: 'Graduate School of Information Science & Technology',
      universityName: 'Osaka University', region: 'JP', country: 'Japan',
      overallScore: 80,
      components: { gpaScore: 82, greQ: 78, greV: 66, lang: 76, research: 62, jlpt: 60 },
      deficits: [],
      recommendations: ['N3 JLPT adds significant points here', 'Consider Osaka as a target application — good admit probability'],
    },
  ];

  // ── Load data from sessionStorage ─────────────────────────────────────────

  function adaptResult(r) {
    if (r.components && r.overallScore !== undefined && r.deficits) return r;
    const overallScore = Math.round(r.overallScore ?? r.compatibilityScore ?? 0);
    const np = r.normalizedProfile || {};
    const dr = r.deficitReport || {};
    const fieldDeltas = dr.fieldDeltas || {};
    const deficits = Object.entries(fieldDeltas).map(([k, v]) => ({ field: k, gap: v }));

    let reg = r.region || 'US';
    if (reg === 'US_CANADA') reg = 'US';
    else if (reg === 'EUROPE') reg = 'EU';
    else if (reg === 'JAPAN') reg = 'JP';

    return {
      programId: r.programId,
      programName: r.programName || 'Master of Science',
      universityName: r.universityName || 'University',
      region: reg,
      country: r.country || (reg === 'US' ? 'USA' : reg === 'JP' ? 'Japan' : 'Europe'),
      overallScore: overallScore,
      components: {
        gpaScore: Math.round((np.normalizedGpa || 0) * 100),
        greQ:     Math.round((np.normalizedGreQuant || 0) * 100),
        greV:     Math.round((np.normalizedGreVerbal || 0) * 100),
        lang:     Math.round((np.normalizedLanguage || 0) * 100),
        research: Math.round((np.normalizedResearch || 0) * 100),
        ects:     np.normalizedEcts !== undefined ? Math.round(np.normalizedEcts * 100) : undefined,
        jlpt:     reg === 'JP' ? Math.round((np.normalizedLanguage || 0) * 100) : undefined,
      },
      deficits: deficits,
      recommendations: dr.actionableRecommendations || [],
    };
  }

  let profile   = null;
  let results   = [];
  let isDemo    = false;

  try {
    const raw = sessionStorage.getItem('scoringResults');
    const pro = sessionStorage.getItem('applicantData') || sessionStorage.getItem('applicantProfile');
    if (pro) profile = JSON.parse(pro);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) {
        results = parsed.map(adaptResult);
      }
    }
  } catch (e) { console.error('sessionStorage parse error', e); }

  if (!results || results.length === 0) {
    results = MOCK_RESULTS;
    isDemo  = true;
  }

  if (!profile) {
    // Fallback demo profile
    profile = {
      fullName: 'Demo Applicant', email: 'demo@example.com',
      cgpa: 8.0, universityName: 'IIT Bombay', degree: 'B.Tech',
      specialization: 'CS', graduationYear: 2024,
      greVerbal: 158, greQuant: 165, greAW: 4.0,
      toefl: 105, ielts: 7.5, jlptLevel: 'N3',
      ectsCredits: 180, bachelorThesis: true,
      researchScore: 60, internshipMonths: 6, publications: 1,
      targetRegion: 'ALL',
    };
    isDemo = true;
  }

  // Show demo banner
  if (isDemo) {
    $('#demoBanner').classList.remove('hidden');
  }

  // ── Render Applicant Summary ───────────────────────────────────────────────

  function renderSummary() {
    $('#avatarInitials').textContent = initials(profile.fullName);
    $('#applicantName').textContent  = profile.fullName || 'Applicant';
    $('#applicantSub').textContent   = [
      profile.degree, profile.specialization, profile.universityName, profile.graduationYear
    ].filter(Boolean).join(' · ');

    // Overall best score
    const best      = results.reduce((max, r) => r.overallScore > max ? r.overallScore : max, 0);
    const bestTier  = getTier(best);
    const tierEl    = $('#overallTier');
    tierEl.textContent = `${getTierEmoji(bestTier)} Best: ${best}%`;
    tierEl.className   = `tier-badge tier-${getTierClass(bestTier)}`;

    // Stats
    const us4 = cgpaToUS4pt(profile.cgpa || 0);
    const jp4 = cgpaToJapanese4pt(profile.cgpa || 0);
    const eu  = cgpaToEctsGrade(profile.cgpa || 0);

    const stats = [
      { label: 'CGPA / 10', val: (profile.cgpa || 0).toFixed(1) },
      { label: 'US 4.0 GPA', val: us4.toFixed(2) },
      { label: 'JP 4.0 GPA', val: jp4.toFixed(2) },
      { label: 'EU Grade', val: eu.letter },
      { label: 'GRE-Q', val: profile.greQuant || '—' },
      { label: 'GRE-V', val: profile.greVerbal || '—' },
      { label: 'TOEFL', val: profile.toefl || '—' },
      { label: 'Programs', val: results.length },
    ];

    $('#statGrid').innerHTML = stats.map(s => `
      <div class="stat-item">
        <div class="stat-val">${s.val}</div>
        <div class="stat-label">${s.label}</div>
      </div>`).join('');
  }

  // ── Region detection ─────────────────────────────────────────────────────

  const regions = [...new Set(results.map(r => r.region))].filter(Boolean);
  const showTabs = regions.length > 1;

  // ── Filtering & Sorting ──────────────────────────────────────────────────

  let activeRegion = regions[0] || 'ALL';
  let activeFilters = { SAFE: true, MATCH: true, REACH: true, UNLIKELY: true };
  let activeSort = 'score-desc';
  let selectedCardId = null;

  function getFilteredSorted(regionFilter) {
    let list = regionFilter === 'ALL' ? results : results.filter(r => r.region === regionFilter);
    list = list.filter(r => activeFilters[getTier(r.overallScore)]);

    switch (activeSort) {
      case 'score-asc':  list.sort((a, b) => a.overallScore - b.overallScore); break;
      case 'name-asc':   list.sort((a, b) => a.universityName.localeCompare(b.universityName)); break;
      case 'name-desc':  list.sort((a, b) => b.universityName.localeCompare(a.universityName)); break;
      default:           list.sort((a, b) => b.overallScore - a.overallScore);
    }
    return list;
  }

  // ── Bar chart HTML helper ─────────────────────────────────────────────────

  function renderBarChart(components, region) {
    const bars = [
      { label: 'GPA',      val: components.gpaScore ?? 0 },
      { label: 'GRE-Q',    val: components.greQ ?? 0 },
      { label: 'GRE-V',    val: components.greV ?? 0 },
      { label: 'Language', val: components.lang ?? 0 },
      { label: 'Research', val: components.research ?? 0 },
    ];
    if (components.ects  !== null && components.ects  !== undefined) bars.push({ label: 'ECTS',  val: components.ects });
    if (components.jlpt  !== null && components.jlpt  !== undefined) bars.push({ label: 'JLPT',  val: components.jlpt });

    return `<div class="bar-chart">
      ${bars.map(b => `
        <div class="bar-item">
          <span class="bar-label">${b.label}</span>
          <div class="bar-track">
            <div class="bar-fill ${getBarClass(b.val)}" data-width="${b.val}" style="width:0%"></div>
          </div>
          <span class="bar-val">${b.val}%</span>
        </div>`).join('')}
    </div>`;
  }

  // Animate all bar fills
  function animateBars(container = document) {
    container.querySelectorAll('.bar-fill[data-width]').forEach(bar => {
      const w = parseFloat(bar.dataset.width);
      // Trigger reflow then animate
      requestAnimationFrame(() => {
        requestAnimationFrame(() => { bar.style.width = `${w}%`; });
      });
    });
  }

  // ── Program card HTML ─────────────────────────────────────────────────────

  function renderProgramCard(prog, idx) {
    const tier      = getTier(prog.overallScore);
    const tierClass = getTierClass(tier);
    const emoji     = getTierEmoji(tier);
    const color     = getScoreColor(tier);

    const deficitHtml = prog.deficits && prog.deficits.length > 0
      ? `<div>
          <button class="collapsible-toggle" aria-expanded="false">
            ⚠️ ${prog.deficits.length} gap${prog.deficits.length > 1 ? 's' : ''} found
            <i class="chevron">▾</i>
          </button>
          <div class="collapsible-content" style="max-height:0;transition:max-height 0.3s ease">
            <ul class="deficit-list">
              ${prog.deficits.map(d => `
                <li class="deficit-item">
                  <span class="icon">⚠️</span>
                  <span><strong>${d.field}:</strong> ${d.gap}</span>
                </li>`).join('')}
            </ul>
          </div>
        </div>`
      : '<p class="text-sm text-success">✅ No significant gaps identified</p>';

    const recHtml = prog.recommendations && prog.recommendations.length > 0
      ? `<ul class="rec-list">
          ${prog.recommendations.map(r => `
            <li class="rec-item"><span>💡</span><span>${r}</span></li>`).join('')}
        </ul>`
      : '';

    return `
      <div class="program-card" data-id="${prog.programId}" data-score="${prog.overallScore}" tabindex="0" role="button"
           aria-label="${prog.programName} at ${prog.universityName} — ${prog.overallScore}% compatibility">
        <div class="program-card-header">
          <!-- Score circle -->
          <div class="score-circle score-${tierClass}" style="--score-pct:${prog.overallScore};--score-color:${color}">
            <div class="score-value">
              ${prog.overallScore}<span>/ 100</span>
            </div>
          </div>
          <div class="program-meta">
            <div class="program-name" title="${prog.programName}">${prog.programName}</div>
            <div class="program-uni">${prog.universityName}</div>
            <div class="program-country">
              <span class="program-region-tag">${regionFlag(prog.region)} ${prog.country || regionName(prog.region)}</span>
            </div>
          </div>
          <span class="tier-badge tier-${tierClass}" style="flex-shrink:0">${emoji} ${tier}</span>
        </div>

        <div class="program-card-divider"></div>

        <!-- Mini bar chart -->
        ${renderBarChart(prog.components || {}, prog.region)}

        <div class="program-card-divider"></div>

        <!-- Deficit & Recs -->
        ${deficitHtml}
        ${recHtml}

        <div class="program-actions">
          <span class="text-xs text-muted">#${prog.programId}</span>
          <button type="button" class="btn btn-ghost btn-sm btn-breakdown" data-action="detail" data-id="${prog.programId}">Full Breakdown →</button>
        </div>
      </div>`;
  }

  // ── Programs grid for a region ────────────────────────────────────────────

  function renderRegionPanel(region) {
    const list = getFilteredSorted(region);
    if (list.length === 0) {
      return `<div class="no-results">
        <div class="icon">🔍</div>
        <h3>No programs match the current filters</h3>
        <p>Try unchecking some tier filters above.</p>
      </div>`;
    }
    return `<div class="programs-grid">${list.map((p, i) => renderProgramCard(p, i)).join('')}</div>`;
  }

  // ── Update results count ──────────────────────────────────────────────────

  function updateCount(region) {
    const list = getFilteredSorted(region);
    const total = region === 'ALL' ? results.length : results.filter(r => r.region === region).length;
    $('#resultsCount').innerHTML = `Showing <strong>${list.length}</strong> of ${total} programs`;
  }

  // ── Main render ───────────────────────────────────────────────────────────

  function renderAll() {
    const container = $('#tabPanelsContainer');
    container.innerHTML = '';

    if (showTabs) {
      // Tab bar
      const tabBar = $('#regionTabBar');
      tabBar.innerHTML = regions.map(r => `
        <button class="tab-btn ${r === activeRegion ? 'active' : ''}"
                role="tab" aria-selected="${r === activeRegion}" data-region="${r}">
          ${regionFlag(r)} ${regionName(r)}
        </button>`).join('');
      $('#regionTabsWrap').classList.remove('hidden');

      // Panels
      regions.forEach(r => {
        const panel = document.createElement('div');
        panel.className = `tab-panel ${r === activeRegion ? 'active' : ''}`;
        panel.dataset.region = r;
        panel.id = `panel-${r}`;
        panel.setAttribute('role', 'tabpanel');
        panel.innerHTML = renderRegionPanel(r);
        container.appendChild(panel);
      });

      updateCount(activeRegion);
    } else {
      // Single region — no tabs
      const r = regions[0] || 'ALL';
      const panel = document.createElement('div');
      panel.className = 'tab-panel active';
      panel.dataset.region = r;
      panel.innerHTML = renderRegionPanel(r);
      container.appendChild(panel);
      updateCount(r);
    }

    // Animate bars
    setTimeout(() => animateBars(), 80);
  }

  // ── Global click handler for breakdowns and cards ─────────────────────────

  document.addEventListener('click', (e) => {
    // 1. Breakdown button or any click inside it
    const btn = e.target.closest('[data-action="detail"], .btn-breakdown');
    if (btn) {
      e.preventDefault();
      e.stopPropagation();
      const card = btn.closest('.program-card');
      const progId = btn.dataset.id || card?.dataset.id;
      if (progId) openSidebar(progId);
      return;
    }

    // 2. Collapsible toggles
    const toggle = e.target.closest('.collapsible-toggle');
    if (toggle) {
      e.preventDefault();
      e.stopPropagation();
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      const content  = toggle.nextElementSibling;
      toggle.setAttribute('aria-expanded', !expanded);
      content.style.maxHeight = expanded ? '0' : content.scrollHeight + 'px';
      return;
    }

    // 3. Card click (when not clicking collapsible content)
    if (e.target.closest('.collapsible-content')) return;
    const card = e.target.closest('.program-card');
    if (card && card.dataset.id) {
      openSidebar(card.dataset.id);
    }
  });

  // Keyboard accessibility
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('program-card')) {
      openSidebar(e.target.dataset.id);
    }
  });

  // ── Tab switching ─────────────────────────────────────────────────────────

  document.addEventListener('click', (e) => {
    const tabBtn = e.target.closest('.tab-btn');
    if (!tabBtn) return;
    activeRegion = tabBtn.dataset.region;
    $$('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.region === activeRegion);
      b.setAttribute('aria-selected', b.dataset.region === activeRegion);
    });
    $$('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.region === activeRegion));
    updateCount(activeRegion);
    setTimeout(() => animateBars(), 80);
  });

  // ── Filters & Sort ────────────────────────────────────────────────────────

  ['filterSafe', 'filterMatch', 'filterReach', 'filterUnlikely'].forEach(id => {
    $(`#${id}`).addEventListener('change', function () {
      const key = id.replace('filter', '').toUpperCase();
      activeFilters[key] = this.checked;
      renderAll();
    });
  });

  $('#sortSelect').addEventListener('change', function () {
    activeSort = this.value;
    renderAll();
  });

  // ── Sidebar ───────────────────────────────────────────────────────────────

  function openSidebar(programId) {
    if (!programId) return;
    const prog = results.find(r => String(r.programId) === String(programId));
    if (!prog) {
      console.warn('Program not found for ID:', programId);
      return;
    }

    // Highlight selected card
    $$('.program-card').forEach(c => c.classList.remove('selected'));
    document.querySelector(`[data-id="${programId}"]`)?.classList.add('selected');
    selectedCardId = programId;

    const tier      = getTier(prog.overallScore);
    const tierClass = getTierClass(tier);
    const color     = getScoreColor(tier);

    // Compute full components (use backend data if available, else compute)
    const comp = prog.components || (typeof buildScoreComponents === 'function' ? buildScoreComponents(profile, prog.region) : {});

    const defHtml = prog.deficits && prog.deficits.length > 0
      ? `<ul class="deficit-list">${prog.deficits.map(d => `
          <li class="deficit-item"><span class="icon">⚠️</span>
            <span><strong>${d.field}:</strong> ${d.gap}</span></li>`).join('')}</ul>`
      : '<p class="text-sm text-success">✅ No significant gaps identified</p>';

    const recHtml = prog.recommendations && prog.recommendations.length > 0
      ? `<ul class="rec-list">${prog.recommendations.map(r => `
          <li class="rec-item"><span>💡</span><span>${r}</span></li>`).join('')}</ul>`
      : '<p class="text-sm text-muted">No specific recommendations.</p>';

    const cgpaVal = profile?.cgpa ?? profile?.cgpa10pt ?? 0;
    const usGpa = typeof cgpaToUS4pt === 'function' ? cgpaToUS4pt(cgpaVal).toFixed(2) : (cgpaVal * 0.4).toFixed(2);
    const jpGpa = typeof cgpaToJapanese4pt === 'function' ? cgpaToJapanese4pt(cgpaVal).toFixed(2) : (cgpaVal * 0.4).toFixed(2);
    const euGrade = typeof cgpaToEctsGrade === 'function' ? (cgpaToEctsGrade(cgpaVal)?.letter || 'B') : 'B';

    $('#sidebarTitle').textContent = prog.programName;
    $('#sidebarContent').innerHTML = `
      <!-- Score hero -->
      <div class="detail-score-hero">
        <div class="score-circle score-circle-lg score-${tierClass}"
             style="--score-pct:${prog.overallScore};--score-color:${color}">
          <div class="score-value">${prog.overallScore}<span>/ 100</span></div>
        </div>
        <div class="detail-score-info">
          <h3>${prog.universityName}</h3>
          <p>${prog.country || regionName(prog.region)} · ${regionFlag(prog.region)}</p>
          <div class="mt-sm">
            <span class="tier-badge tier-${tierClass}">${getTierEmoji(tier)} ${tier}</span>
          </div>
        </div>
      </div>

      <!-- Full Score Breakdown -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Score Breakdown</div>
        ${renderBarChart(comp, prog.region)}
      </div>

      <!-- Gaps -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Identified Gaps</div>
        ${defHtml}
      </div>

      <!-- Recommendations -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Recommendations</div>
        ${recHtml}
      </div>

      <!-- GPA conversions -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Your GPA in This Context</div>
        <div class="stat-grid" style="grid-template-columns:1fr 1fr 1fr">
          <div class="stat-item">
            <div class="stat-val">${usGpa}</div>
            <div class="stat-label">🇺🇸 US 4.0</div>
          </div>
          <div class="stat-item">
            <div class="stat-val">${jpGpa}</div>
            <div class="stat-label">🇯🇵 JP 4.0</div>
          </div>
          <div class="stat-item">
            <div class="stat-val">${euGrade}</div>
            <div class="stat-label">🇪🇺 ECTS</div>
          </div>
        </div>
      </div>

      <!-- Program ID -->
      <p class="text-xs text-muted" style="margin-top:1rem">Program ID: #${prog.programId}</p>
    `;

    $('#detailSidebar').classList.add('open');
    $('#sidebarOverlay').classList.add('visible');
    document.body.style.overflow = 'hidden';

    setTimeout(() => animateBars($('#sidebarContent')), 120);
  }

  function closeSidebar() {
    $('#detailSidebar').classList.remove('open');
    $('#sidebarOverlay').classList.remove('visible');
    document.body.style.overflow = '';
    $$('.program-card').forEach(c => c.classList.remove('selected'));
    selectedCardId = null;
  }

  $('#closeSidebar').addEventListener('click', closeSidebar);
  $('#sidebarOverlay').addEventListener('click', closeSidebar);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSidebar(); });

  // ── Print / PDF export ────────────────────────────────────────────────────

  $('#printBtn').addEventListener('click', () => {
    closeSidebar();
    setTimeout(() => window.print(), 300);
  });

  // ── Initialize ────────────────────────────────────────────────────────────

  renderSummary();
  renderAll();

  if (isDemo) {
    showToast('Demo Mode', 'Showing sample data. Submit the form with backend running for live results.', 'info');
  }
</script>

</body>
</html>
