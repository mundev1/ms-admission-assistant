spring.application.name=ms-admissions-engine
server.port=8080

# Default Embedded Database (H2 in-memory) for immediate out-of-the-box execution
spring.datasource.url=jdbc:h2:mem:ms_admissions_engine;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate auto table generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.com.admissions=INFO
logging.level.org.springframework.web=INFO
